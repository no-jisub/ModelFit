name: Audit external links

on:
  schedule:
    - cron: "17 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Restore private catalog sources
        run: npm run catalog:ci:restore
        env:
          MODELFIT_CATALOG_GZIP_1: ${{ secrets.MODELFIT_CATALOG_GZIP_1 }}
          MODELFIT_CATALOG_GZIP_2: ${{ secrets.MODELFIT_CATALOG_GZIP_2 }}
          MODELFIT_CATALOG_GZIP_3: ${{ secrets.MODELFIT_CATALOG_GZIP_3 }}
      - name: Generate catalog data
        run: npm run catalog:import
      - run: npm run validate:data
      - run: npm run audit:freshness
      - run: npm run audit:sources
